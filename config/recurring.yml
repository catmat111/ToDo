production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  reminder_dispatch:
    class: ReminderDispatchJob
    queue: default
    schedule: every minute
  due_task_notifications:
    class: DueTaskNotificationJob
    queue: default
    schedule: every hour
  mailbox_sync:
    class: MailboxSyncJob
    queue: default
    schedule: every hour at minute 5
  follow_up_reminders:
    class: FollowUpReminderJob
    queue: default
    schedule: every day at 9am

development:
  reminder_dispatch:
    class: ReminderDispatchJob
    queue: default
    schedule: every minute
  due_task_notifications:
    class: DueTaskNotificationJob
    queue: default
    schedule: every hour
  mailbox_sync:
    class: MailboxSyncJob
    queue: default
    schedule: every hour at minute 5
  follow_up_reminders:
    class: FollowUpReminderJob
    queue: default
    schedule: every day at 9am
