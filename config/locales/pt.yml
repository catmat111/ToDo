    errors:
      messages:
        record_invalid: "A validação falhou: %{errors}"
      models:
        tag:
          attributes:
            name:
              taken: já existe numa das tuas etiquetas
        link:
          attributes:
            linkable_type:
              inclusion: não permite links
        user:
          attributes:
            email_address:
              taken: já está registado

  # Fallback partilhado por todos os modelos (human_attribute_name procura aqui em último lugar).
  attributes:
    created_at: Criado em
    updated_at: Atualizado em
    user: Utilizador
    user_id: Utilizador
    task: Tarefa
    task_id: Tarefa
    tag_id: Etiqueta
    job_search_id: Pesquisa
    job_application_id: Candidatura
    calendar_connection_id: Ligação ao calendário
    notifiable_type: Tipo de origem
    notifiable_id: Origem

  # Mensagens neutras quanto ao género ("Título/Descrição não pode ficar em branco").
  errors:
    format: "%{attribute} %{message}"
    messages:
      blank: não pode ficar em branco
      present: tem de ficar em branco
      empty: não pode ficar vazio
      required: tem de existir
      taken: já está em uso
      invalid: não é válido
      inclusion: não é uma opção válida
      exclusion: não está disponível
      confirmation: não coincide com %{attribute}
      too_long: tem demasiados caracteres (máximo %{count})
      too_short: tem poucos caracteres (mínimo %{count})
      wrong_length: tem de ter exatamente %{count} caracteres
      password_too_long: é demasiado longa
      not_a_number: tem de ser um número
      not_an_integer: tem de ser um número inteiro

  helpers:
    select:
      prompt: Selecione uma opção
    submit:
      create: Criar %{model}
      update: Guardar %{model}
      submit: Guardar %{model}
      task:
        create: Criar tarefa
        update: Guardar alterações
      tag:
        create: Criar etiqueta
        update: Guardar alterações
      reminder:
        create: Adicionar lembrete
        update: Guardar lembrete
      link:
        create: Adicionar link
        update: Guardar link
      job_search:
        create: Criar pesquisa
        update: Guardar alterações
      job_filter:
        create: Adicionar filtro
        update: Guardar filtro
      job_listing:
        create: Guardar vaga
        update: Guardar alterações
      job_application:
        create: Criar candidatura
        update: Guardar alterações
      job_application_event:
        create: Registar evento
        update: Guardar evento
      task_recurrence:
        create: Ativar recorrência
        update: Guardar recorrência
      user:
        create: Criar conta
        update: Guardar alterações

  date:
    formats:
      default: "%d/%m/%Y"
      short: "%-d %b %Y"
      long: "%-d de %B de %Y"
      day: "%-d %b"
      month: "%B de %Y"
      weekday: "%A, %-d de %B"

  time:
    formats:
      default: "%-d %b %Y, %H:%M"
      short: "%-d %b %Y, %H:%M"
      long: "%-d de %B de %Y às %H:%M"
      day: "%-d %b"
      day_time: "%-d %b, %H:%M"
      time: "%H:%M"
      weekday: "%A, %-d de %B"
